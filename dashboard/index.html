<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marshal Fly · Race Control</title>
<link rel="stylesheet" href="style.css?v=7">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🪰</span> Marshal Fly <span class="sub">race control</span></div>
  <div class="views">
    <button id="btn-2d" class="on">2D map</button>
    <button id="btn-3d">3D view</button>
  </div>
  <div class="cams only3d">
    <button data-cam="orbit" class="on" title="Free orbit (drag / wheel)">Orbit</button>
    <button data-cam="chase" title="Orbit around the selected drone">Chase</button>
    <button data-cam="drone" title="Selected drone's gimbal camera (drag to pan, wheel to zoom)">Drone cam</button>
    <button data-cam="tv" title="Nearest trackside camera zooms on the action">TV cam</button>
    <button data-cam="incident">Incident</button>
    <span class="sep"></span>
    <span id="drone-select" class="drone-select"></span>
    <span class="sep"></span>
    <label class="toggle"><input type="checkbox" id="tg-labels" checked> Labels</label>
    <label class="toggle"><input type="checkbox" id="tg-feeds" checked> Feeds</label>
  </div>
  <div class="conn"><span id="conn-tel" class="dot"></span>telemetry <span id="conn-brain" class="dot"></span>brain <span id="clock">t = 0.0 s</span></div>
</header>
<main>
  <section id="stage">
    <canvas id="map2d"></canvas>
    <div id="view3d" hidden></div>
    <div id="hud" hidden>
      <div class="hud-top"><span class="rec">● REC</span> <span id="hud-title"></span><span id="hud-time"></span></div>
      <div class="crosshair"></div>
      <div class="hud-bottom" id="hud-stats"></div>
      <div class="hud-hint">drag: pan/tilt · wheel: zoom · double-click: auto-track</div>
    </div>
    <canvas id="minimap" class="only3d-stage" hidden></canvas>
    <div id="tiles" class="only3d-stage" hidden></div>
  </section>
  <aside>
    <div class="panel">
      <h2>Alerts</h2>
      <ul id="alerts"><li class="empty">No active events</li></ul>
    </div>
    <div class="panel">
      <h2>Incident report</h2>
      <div id="report" class="empty">Waiting for an incident…</div>
    </div>
    <div class="panel">
      <h2>Drones</h2>
      <ul id="drones"></ul>
    </div>
    <div class="panel">
      <h2>Fly brain <span class="muted">drone 0 · FlyWire FAFB v783</span></h2>
      <canvas id="flybrain"></canvas>
      <ul id="fly-legend" class="legend"></ul>
      <div class="bars">
        <label title="controller output">forward</label><div class="bar"><i id="b-forward"></i></div>
        <label>turn</label><div class="bar mid"><i id="b-turn"></i></div>
        <label>climb</label><div class="bar mid"><i id="b-climb"></i></div>
      </div>
      <div class="spikes"><span id="spikes">0</span> neurons firing</div>
      <div id="fly-kind" class="muted fly-kind">loading brain…</div>
    </div>
  </aside>
</main>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
